<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Esther Custódio</title>
<!-- Esta página não deve aparecer no Google -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3eee9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23808080'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%2314110d' font-family='Georgia,serif' font-style='italic'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#f3eee9; --paper:#fbf9f6; --ink:#14110d; --accent:#808080; --accent-text:#595959;
  --marrom:#4d301b; --muted:#5c554d; --line:rgba(20,17,13,.16);
  --radius:8px; --radius-lg:16px;
  --shadow:0 1px 2px rgba(20,17,13,.06), 0 14px 34px -14px rgba(20,17,13,.22);
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem;
  background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
  background-image:linear-gradient(rgba(20,17,13,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(20,17,13,.045) 1px,transparent 1px);
  background-size:44px 44px;
}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.cartao{
  width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:2rem 1.75rem;
}
.marca{display:flex;align-items:center;gap:.6rem;margin-bottom:1.4rem}
.marca-logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-style:italic;font-weight:600;font-size:1.05rem;font-family:Georgia,serif}
.marca-nome{font-weight:600;font-size:.95rem}
h1{margin:0 0 .25rem;font-size:1.2rem;font-weight:600}
.sub{margin:0 0 1.3rem;color:var(--muted);font-size:.9rem}
.faixa{
  display:none;margin:0 0 1rem;padding:.7rem .85rem;border-radius:var(--radius);
  font-size:.88rem;font-weight:500;
}
.faixa.erro{display:block;background:#f6d5d0;color:#7a1a0d}
.faixa.ok{display:block;background:#dcebdc;color:#1d4f27}
.campo{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.campo label{font-weight:600;font-size:.85rem}
.campo input{
  width:100%;padding:.75rem .85rem;background:#fff;color:var(--ink);font:inherit;
  border:1px solid rgba(20,17,13,.4);border-radius:var(--radius);
}
.campo input:focus{outline:none;border-color:var(--accent-text);box-shadow:0 0 0 3px rgba(128,128,128,.4)}
.botao{
  width:100%;padding:.8rem 1rem;border:1.5px solid transparent;border-radius:var(--radius);
  background:var(--accent);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;
  transition:background .2s,color .2s;
}
.botao:hover:not(:disabled){background:var(--ink);color:var(--cream)}
.botao:disabled{opacity:.6;cursor:progress}
.link{
  display:block;margin:1rem auto 0;padding:.3rem;background:none;border:0;cursor:pointer;
  font:inherit;font-size:.85rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px;
}
.link:hover{color:var(--ink)}
.rodape{margin-top:1.1rem;text-align:center;font-size:.8rem}
.rodape a{color:var(--muted)}
</style>
</head>

<body>
<main class="cartao" aria-labelledby="titulo">
  <div class="marca">
    <span class="marca-logo" aria-hidden="true">E</span>
    <span class="marca-nome">Esther Custódio</span>
  </div>

  <!-- Faixa de aviso (erro ou sucesso) -->
  <div id="faixa" class="faixa" role="alert"></div>

  <!-- TELA 1: entrar -->
  <form id="formEntrar" novalidate>
    <h1 id="titulo">Entrar</h1>
    <p class="sub">Área só para a Esther.</p>
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
    </div>
    <button class="botao" id="botaoEntrar" type="submit">Entrar</button>
    <button class="link" id="botaoEsqueci" type="button">Esqueci minha senha</button>
  </form>

  <!-- TELA 2: criar nova senha (aparece quando você chega pelo link do e-mail de recuperação) -->
  <form id="formNovaSenha" novalidate hidden>
    <h1>Criar nova senha</h1>
    <p class="sub">Escolha uma senha com pelo menos 8 caracteres.</p>
    <div class="campo">
      <label for="novaSenha">Nova senha</label>
      <input id="novaSenha" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="campo">
      <label for="novaSenha2">Repita a nova senha</label>
      <input id="novaSenha2" type="password" autocomplete="new-password" minlength="8" required>
    </div>
    <button class="botao" id="botaoNovaSenha" type="submit">Salvar nova senha</button>
  </form>

  <p class="rodape"><a href="../">Voltar para o portfólio</a></p>
</main>

<!-- O Supabase vem por CDN; o banco.js guarda o endereço e a chave pública -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var faixa = $('faixa');

  function mostrarFaixa(texto, tipo) {
    faixa.textContent = texto;
    faixa.className = 'faixa ' + (tipo === 'ok' ? 'ok' : 'erro');
    faixa.setAttribute('role', tipo === 'ok' ? 'status' : 'alert');
  }
  function limparFaixa() { faixa.className = 'faixa'; faixa.textContent = ''; }

  /* Traduz os erros do Supabase para português simples (nunca mostra inglês) */
  function traduzir(erro) {
    var msg = String((erro && erro.message) || '').toLowerCase();
    var codigo = erro && (erro.code || '');
    if (codigo === 'invalid_credentials' || msg.indexOf('invalid login credentials') >= 0) return 'E-mail ou senha incorretos';
    if (codigo === 'email_not_confirmed' || msg.indexOf('email not confirmed') >= 0) return 'Confirme o seu e-mail antes de entrar.';
    if (erro && (erro.status === 429 || codigo === 'over_request_rate_limit' || codigo === 'over_email_send_rate_limit')) return 'Muitas tentativas seguidas. Espere um minuto e tente de novo.';
    if (erro && (erro.name === 'AuthRetryableFetchError' || msg.indexOf('failed to fetch') >= 0 || msg.indexOf('network') >= 0)) return 'Sem conexão com o servidor. Confira a internet e tente de novo.';
    if (codigo === 'same_password' || msg.indexOf('different from the old') >= 0) return 'A nova senha precisa ser diferente da antiga.';
    if (codigo === 'weak_password' || msg.indexOf('password should be') >= 0) return 'Essa senha é fraca. Use pelo menos 8 caracteres.';
    return 'Não foi possível concluir agora. Tente de novo em instantes.';
  }

  if (!window.banco) {
    mostrarFaixa('Não consegui carregar o sistema de login. Confira a internet e recarregue a página.', 'erro');
    $('botaoEntrar').disabled = true;
    return;
  }
  var banco = window.banco;

  var voltandoDoEmail = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
  var mostrandoNovaSenha = false;

  function mostrarNovaSenha() {
    if (mostrandoNovaSenha) return;
    mostrandoNovaSenha = true;
    $('formEntrar').hidden = true;
    $('formNovaSenha').hidden = false;
    document.title = 'Nova senha | Esther Custódio';
    $('novaSenha').focus();
  }

  /* O link do e-mail de recuperação chegou vencido ou já usado */
  if (/error_code=|error=access_denied/.test(location.hash)) {
    mostrarFaixa('Este link expirou ou já foi usado. Peça outro em "Esqueci minha senha".', 'erro');
    voltandoDoEmail = false;
  }

  banco.auth.onAuthStateChange(function (evento) {
    if (evento === 'PASSWORD_RECOVERY') mostrarNovaSenha();
  });

  /* Se já tem sessão aberta, vai direto para o admin (menos quando a pessoa está criando nova senha) */
  banco.auth.getSession().then(function (r) {
    var sessao = r && r.data && r.data.session;
    if (voltandoDoEmail && sessao) { mostrarNovaSenha(); return; }
    if (sessao) location.replace('../admin/');
  });

  /* ENTRAR */
  $('formEntrar').addEventListener('submit', function (e) {
    e.preventDefault();
    limparFaixa();
    var email = $('email').value.trim();
    var senha = $('senha').value;
    if (!email || !senha) { mostrarFaixa('Preencha o e-mail e a senha.', 'erro'); return; }
    var botao = $('botaoEntrar');
    botao.disabled = true; botao.textContent = 'Entrando...';
    banco.auth.signInWithPassword({ email: email, password: senha }).then(function (r) {
      if (r.error) {
        mostrarFaixa(traduzir(r.error), 'erro');
        botao.disabled = false; botao.textContent = 'Entrar';
        return;
      }
      location.replace('../admin/');
    }).catch(function (erro) {
      mostrarFaixa(traduzir(erro), 'erro');
      botao.disabled = false; botao.textContent = 'Entrar';
    });
  });

  /* ESQUECI MINHA SENHA */
  $('botaoEsqueci').addEventListener('click', function () {
    limparFaixa();
    var email = $('email').value.trim();
    if (!email) { mostrarFaixa('Digite o seu e-mail no campo acima e clique de novo em "Esqueci minha senha".', 'erro'); $('email').focus(); return; }
    var botao = $('botaoEsqueci');
    botao.disabled = true;
    banco.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }).then(function (r) {
      botao.disabled = false;
      if (r.error) { mostrarFaixa(traduzir(r.error), 'erro'); return; }
      mostrarFaixa('Pronto. Se esse e-mail tiver cadastro, enviamos um link para criar uma nova senha. Olhe também a caixa de spam.', 'ok');
    }).catch(function (erro) {
      botao.disabled = false;
      mostrarFaixa(traduzir(erro), 'erro');
    });
  });

  /* CRIAR NOVA SENHA (depois de clicar no link do e-mail) */
  $('formNovaSenha').addEventListener('submit', function (e) {
    e.preventDefault();
    limparFaixa();
    var a = $('novaSenha').value, b = $('novaSenha2').value;
    if (a.length < 8) { mostrarFaixa('A senha precisa ter pelo menos 8 caracteres.', 'erro'); return; }
    if (a !== b) { mostrarFaixa('As duas senhas não são iguais.', 'erro'); return; }
    var botao = $('botaoNovaSenha');
    botao.disabled = true; botao.textContent = 'Salvando...';
    banco.auth.updateUser({ password: a }).then(function (r) {
      if (r.error) {
        mostrarFaixa(traduzir(r.error), 'erro');
        botao.disabled = false; botao.textContent = 'Salvar nova senha';
        return;
      }
      mostrarFaixa('Senha alterada. Entrando...', 'ok');
      setTimeout(function () { location.replace('../admin/'); }, 900);
    }).catch(function (erro) {
      mostrarFaixa(traduzir(erro), 'erro');
      botao.disabled = false; botao.textContent = 'Salvar nova senha';
    });
  });
})();
</script>
</body>
</html>
